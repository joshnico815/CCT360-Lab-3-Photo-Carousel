<!DOCTYPE html>
<html>
<head>
  <title>Journey to Victory</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Kavoon&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>

  <h1>Journey to Victory</h1>

  <p>The weight of Lebron James' champions are built upon his defeat</p>

  <div class="controls">
    <button id="story1">Story #1: Defeat</button>
    <button id="story2">Story #2: Champions</button>
  </div>

  <h2 id="storyTitle">The Defeat</h2>

  <div class="story">
    <h3 id="storyStage">The Beginning</h3>
    <img id="storyImage" src="images/Championship.jpg">
    <p id="storyText">Lebron James wins NBA Finals</p>
  </div>

  <div class="controls">
    <button id="previousButton">Previous</button>
    <button id="nextButton">Next</button>
  </div>

  <script src="script.js"></script>

</body>

</html>
